name: swarm-oscar
services:
  shop:
    build:
      context: .
      target: development
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./oscar:/app/oscar
      - ./seed.py:/opt/environment/seed.py:ro
      - node_modules:/app/oscar/node_modules
    environment:
      DATABASE_ENGINE: django.db.backends.sqlite3
      ALLOWED_HOSTS: localhost,127.0.0.1
    mem_limit: 2g
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
volumes:
  node_modules:
