name: swarm-work
services:
  mlflow:
    image: swarm-controller:local
    entrypoint: ["mlflow"]
    command: ["server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1", "--backend-store-uri", "sqlite:////state/mlflow.db", "--artifacts-destination", "/state/artifacts", "--allowed-hosts", "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"]
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["./data/mlflow:/state"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 1g
  controller:
    build: .
    image: swarm-controller:local
    env_file: ../../.env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SWARM_DATA: /state
      SWARM_OUTPUT_UID: ${SWARM_OUTPUT_UID:-1000}
      SWARM_OUTPUT_GID: ${SWARM_OUTPUT_GID:-1000}
    volumes:
      - ./data/controller:/state
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mlflow:
        condition: service_healthy
    mem_limit: 1g
